services:
  notevault:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TEAM_ID=${TEAM_ID:-unassigned}
      - TEAM_SALT=${TEAM_SALT:-notevault-anti-copy-dev-salt}
      - NOTEVAULT_SECRET=${NOTEVAULT_SECRET:?Set NOTEVAULT_SECRET before starting}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      - NOTEVAULT_HOST=0.0.0.0
      - NOTEVAULT_PORT=8080
